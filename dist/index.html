<style>

-size:16px;margin:0;font-weight:600}#birs-demo h3{font-size:14px;margin:0}#birs-demo p{margin:3px 0;color:var(--muted);font-size:13px}#birs-demo .eyebrow{font-size:11px;color:var(--brand);letter-spacing:1.3px;text-transform:uppercase;margin-bottom:5px}#birs-demo .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}#birs-demo .stat{background:white;border:1px solid var(--line);border-radius:9px;padding:15px}#birs-demo .stat small{display:block;color:var(--muted);font-size:12px}#birs-demo .stat strong{font-size:27px;display:block;font-weight:500;margin:5px 0}#birs-demo .stat span{font-size:11px;color:var(--brand)}#birs-demo .panel{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}#birs-demo .panel-head{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:10px}#birs-demo .tools{display:flex;gap:9px;padding:12px 15px;background:white;flex-wrap:wrap;border-bottom:1px solid var(--line)}#birs-demo input,#birs-demo select,#birs-demo textarea{border:1px solid var(--line);border-radius:6px;background:white;padding:9px;color:var(--ink);max-width:100%}#birs-demo .search{flex:1;min-width:145px}#birs-demo .map-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px}#birs-demo .map-wrap{position:relative;min-width:0;background:#edf2e9}#birs-demo .map{width:100%;height:380px;display:block;touch-action:none}#birs-demo .map-control{position:absolute;left:12px;top:12px;display:flex;gap:4px}#birs-demo .map-control button{padding:5px 10px;box-shadow:0 2px 8px #063d2510}#birs-demo .map-caption{position:absolute;bottom:7px;left:10px;font-size:10px;background:#ffffffe0;padding:2px 5px;color:#566b60}#birs-demo .map-caption a{color:inherit}#birs-demo .detail{padding:17px;border-left:1px solid var(--line)}#birs-demo .detail .initial{width:42px;height:42px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:600;border-radius:9px;margin-bottom:12px}#birs-demo .badge{font-size:11px;display:inline-block;border-radius:5px;padding:3px 7px;background:var(--soft);color:var(--brand)}#birs-demo .badge.pending{background:#fff3d9;color:#8c610e}#birs-demo .badge.followup{background:#eaf0fc;color:#375b9f}#birs-demo .detail dl{font-size:12px;margin:16px 0}#birs-demo .detail dt{color:var(--muted);margin-top:11px}#birs-demo .detail dd{margin:2px 0}#birs-demo .detail button{width:100%;margin-top:7px;font-size:12px}#birs-demo .legend{padding:9px 15px;display:flex;gap:15px;flex-wrap:wrap;font-size:11px;border-top:1px solid var(--line)}#birs-demo .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}#birs-demo .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:17px}#birs-demo .rows{padding:4px 17px}#birs-demo .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}#birs-demo .row:last-child{border:0}#birs-demo .row small{color:var(--muted);display:block;font-size:11px}#birs-demo .bar{height:5px;background:var(--soft);border-radius:4px;margin-top:6px;width:100%}#birs-demo .bar span{display:block;height:100%;background:var(--brand);border-radius:4px}#birs-demo table{border-collapse:collapse;width:100%;font-size:12px}#birs-demo th{text-align:left;color:var(--muted);font-weight:500;background:#fafcf9}#birs-demo td,#birs-demo th{padding:13px 15px;border-bottom:1px solid var(--line)}#birs-demo .table-scroll{overflow:auto}#birs-demo .link{border:0;color:var(--brand);padding:0;background:transparent;text-align:left}#birs-demo .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px}#birs-demo label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500}#birs-demo .span2{grid-column:1/-1}#birs-demo .formfoot{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}#birs-demo .location-box{background:var(--soft);border:1px solid #d2e8d8;border-radius:8px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}#birs-demo .notice{font-size:12px;padding:12px 17px;background:#fff8e9;color:#7e641f}#birs-demo .toast{padding:10px 15px;background:var(--soft);color:var(--brand);border-radius:7px;margin-bottom:15px}#birs-demo .empty{padding:30px;text-align:center;color:var(--muted)}#birs-demo svg text{font-family:Roboto,Arial,sans-serif}#birs-demo .map-pin{cursor:pointer}#birs-demo .visit-card{margin:15px;padding:15px;border:1px solid var(--line);border-radius:8px}#birs-demo .visit-card button{margin-top:10px}#birs-demo .status-note{font-size:11px;color:var(--muted);margin-top:8px}#birs-demo .map-pin:focus{outline:none}#birs-demo .map-pin:focus circle{stroke:#173c2a;stroke-width:4}
@media(max-width:850px){#birs-demo .shell{grid-template-columns:150px minmax(0,1fr)}#birs-demo main{padding:18px}#birs-demo .map-layout{grid-template-columns:1fr}#birs-demo .detail{border-left:0;border-top:1px solid var(--line);display:block}#birs-demo .detail dl{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}#birs-demo .detail dt{margin-top:5px}#birs-demo .detail button{width:auto;margin-right:5px}#birs-demo .stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){#birs-demo .shell{display:block}#birs-demo aside{flex-direction:row;padding:7px;overflow:auto;gap:2px;border-right:0;border-bottom:1px solid var(--line)}#birs-demo .nav-label,#birs-demo aside .foot{display:none}#birs-demo .nav{padding:9px;font-size:12px;white-space:nowrap}#birs-demo .nav i{display:none}#birs-demo .top{padding:14px; padding-right:95px}#birs-demo .identity{display:block}#birs-demo .identity img{width:100px}#birs-demo .identity strong{font-size:12px}#birs-demo .pilot{display:none}#birs-demo .demo-strip{padding:7px 14px}#birs-demo .demo-strip span:last-child{display:none}#birs-demo main{padding:14px}#birs-demo .heading{align-items:flex-start;flex-wrap:wrap}#birs-demo h1{font-size:22px}#birs-demo .twocol,#birs-demo .formgrid{grid-template-columns:1fr}#birs-demo .span2{grid-column:auto}#birs-demo .map{height:330px}#birs-demo .location-box{align-items:flex-start;flex-direction:column}}
#birs-demo .detail-overview{background:white;border:1px solid var(--line);border-radius:9px;padding:17px;margin-bottom:17px}.detail-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}#birs-demo .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}#birs-demo .full-fields{padding:16px 20px;margin:0;overflow-wrap:anywhere}#birs-demo .full-fields dt{color:var(--muted);font-size:13px;margin-top:13px}#birs-demo .full-fields dt:first-child{margin-top:0}#birs-demo .full-fields dd{margin:3px 0;font-size:14px;white-space:pre-wrap}#birs-demo .detail-actions button{font-size:14px}#birs-demo .badge{font-size:13px}#birs-demo{min-height:100vh;border-radius:0}#birs-demo .nav.active{font-weight:600}@media(max-width:700px){#birs-demo .detail-grid{grid-template-columns:1fr}}</style>
<header class="top"><div class="identity"><img id="birs-demo-logo" alt="BIRS"><div><strong>Taxpayer Monitoring</strong><small>Benue State Internal Revenue Service</small></div></div><span class="pilot">Makurdi pilot</span></header>
<div class="demo-strip"><span>INTERACTIVE DEMO · Fictional customer records and approximate sample locations</span><span>Designed by Kimbly Technologies</span></div>
<div class="shell"><aside><div class="nav-label">Workspace</div><button class="nav active" data-page="overview"><i data-lucide="layout-dashboard"></i>Overview</button><button class="nav" data-page="map"><i data-lucide="map"></i>Location map</button><button class="nav" data-page="records"><i data-lucide="users"></i>Customer records</button><button class="nav" data-page="register"><i data-lucide="map-pin-plus"></i>Field registration</button><button class="nav" data-page="reviews"><i data-lucide="clipboard-check"></i>Verification queue</button><button class="nav" data-page="visits"><i data-lucide="route"></i>Field visits</button><div class="foot">MAKURDI AREA OFFICE<br>Supervisor demo<br><br>Saved in this browser</div></aside><main><div id="birs-demo-content"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(()=>{
const root=document.getElementById('birs-demo'),content=root.querySelector('#birs-demo-content');
const seedRecords=[
{id:'MKD-001',name:'Riverbank Provisions',category:'Retail',area:'Wadata',address:'Sample premises, Wadata',status:'Verified',type:'Standalone business',owner:'Sample taxpayer A',lng:8.510,lat:7.725,officer:'Officer A'},
{id:'MKD-002',name:'Central Trade Plaza',category:'Commercial property',area:'High Level',address:'Sample plaza, High Level',status:'Verified',type:'Plaza',owner:'Sample property owner',lng:8.528,lat:7.712,officer:'Officer B',units:12},
{id:'MKD-003',name:'Greenleaf Pharmacy',category:'Healthcare',area:'High Level',address:'Sample premises, High Level',status:'Pending review',type:'Standalone business',owner:'Sample taxpayer B',lng:8.535,lat:7.710,officer:'Officer B'},
{id:'MKD-004',name:'Northside Building Supplies',category:'Retail',area:'North Bank',address:'Sample premises, North Bank',status:'Follow-up',type:'Standalone business',owner:'Sample taxpayer C',lng:8.540,lat:7.758,officer:'Officer C'},
{id:'MKD-005',name:'Market Fresh Foods',category:'Retail',area:'Modern Market',address:'Sample premises, Modern Market',status:'Verified',type:'Shop',owner:'Sample taxpayer D',lng:8.498,lat:7.706,officer:'Officer A'},
{id:'MKD-006',name:'Sunrise Guesthouse',category:'Hospitality',area:'Wurukum',address:'Sample premises, Wurukum',status:'Pending review',type:'Standalone business',owner:'Sample taxpayer E',lng:8.555,lat:7.729,officer:'Officer B'},
{id:'MKD-007',name:'Unity Auto Workshop',category:'Services',area:'North Bank',address:'Sample premises, North Bank',status:'Verified',type:'Standalone business',owner:'Sample taxpayer F',lng:8.556,lat:7.751,officer:'Officer C'},
{id:'MKD-008',name:'Avenue Fashion Studio',category:'Services',area:'High Level',address:'Unit 01, Central Trade Plaza',status:'Verified',type:'Shop',owner:'Sample taxpayer G',lng:8.5284,lat:7.7124,officer:'Officer B',parent:'MKD-002'},
{id:'MKD-009',name:'Cornerstone Electronics',category:'Retail',area:'Wurukum',address:'Sample premises, Wurukum',status:'Follow-up',type:'Standalone business',owner:'Sample taxpayer H',lng:8.551,lat:7.721,officer:'Officer B'},
{id:'MKD-010',name:'Oakline Furniture',category:'Manufacturing',area:'Wadata',address:'Sample premises, Wadata',status:'Verified',type:'Standalone business',owner:'Sample taxpayer I',lng:8.504,lat:7.717,officer:'Officer A'},
{id:'MKD-011',name:'Westgate Catering',category:'Hospitality',area:'Modern Market',address:'Sample premises, Modern Market',status:'Pending review',type:'Standalone business',owner:'Sample taxpayer J',lng:8.490,lat:7.700,officer:'Officer A'},
{id:'MKD-012',name:'Bridgeview Traders',category:'Retail',area:'North Bank',address:'Sample premises, North Bank',status:'Verified',type:'Standalone business',owner:'Sample taxpayer K',lng:8.531,lat:7.755,officer:'Officer C'}];
let records=seedRecords.map(r=>({...r}));
let page='overview',selected=records[1],filter='All statuses',query='',message='',parentId='',editingId='',storageError='',zoom,svg,mapGroup;
let activity=[{title:'Central Trade Plaza verified',sub:'Supervisor · sample activity'},{title:'Greenleaf Pharmacy submitted',sub:'Officer B · awaiting review'},{title:'Northside visit assigned',sub:'Officer C · follow-up'}];
let visits=[{record:'MKD-004',officer:'Officer C',state:'Scheduled',note:'Confirm current business activity and contact details.'},{record:'MKD-009',officer:'Officer B',state:'Scheduled',note:'Review location and update occupancy record.'}];
const STORAGE_KEY='birs-makurdi-demo-v2';
function restore(){
 try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const saved=JSON.parse(raw);
 if(saved.version!==2||!Array.isArray(saved.records)||!saved.records.every(r=>r&&typeof r.id==='string'&&typeof r.name==='string'&&Number.isFinite(r.lat)&&Number.isFinite(r.lng)&&['Verified','Pending review','Follow-up'].includes(r.status)))throw Error('Invalid saved records');
 records=saved.records;activity=Array.isArray(saved.activity)?saved.activity:[];visits=Array.isArray(saved.visits)?saved.visits:[];selected=records[0]||null;
 }catch(e){storageError='Saved data could not be loaded. Sample records are shown; your stored copy has not been changed.';}
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:2,records,activity:activity.slice(0,100),visits,savedAt:new Date().toISOString()}));storageError='';return true;}catch(e){storageError='Browser storage is unavailable or full. Changes are kept on this page only. Keep this page open to retain them.';return false;}}
function recordEvent(title,recordId){activity.unshift({title,recordId,sub:'Supervisor demo · '+new Date().toLocaleString(),at:new Date().toISOString()});}
function nextId(){return 'MKD-'+String(Math.max(0,...records.map(r=>Number(r.id.split('-').at(-1))||0))+1).padStart(3,'0');}
restore();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusClass=s=>s==='Pending review'?'pending':s==='Follow-up'?'followup':'';
const badge=s=>`<span class="badge ${statusClass(s)}">${esc(s)}</span>`;
const filtered=()=>records.filter(r=>(filter==='All statuses'||r.status===filter)&&`${r.name} ${r.id} ${r.area} ${r.owner}`.toLowerCase().includes(query.toLowerCase()));
const colours={'Verified':'#048b3f','Pending review':'#d59a25','Follow-up':'#517cbc'};
function go(p){page=p;query='';filter='All statuses';render();window.scrollTo({top:0,behavior:'instant'})}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">Makurdi · operational workspace</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stats(){return `<div class="stats">${[['Customer records',records.length,'Registered in this demo'],['Verified',records.filter(r=>r.status==='Verified').length,'Reviewed by a supervisor'],['Pending review',records.filter(r=>r.status==='Pending review').length,'Awaiting verification'],['Follow-up',records.filter(r=>r.status==='Follow-up').length,'Field action required']].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div>`}
function toolbar(){return `<div class="tools"><input class="search" aria-label="Search customer records" placeholder="Search business, record ID or area" value="${esc(query)}"><select class="status-filter" aria-label="Filter by status">${['All statuses','Verified','Pending review','Follow-up'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select></div>`}
function mapPanel(){return `<div class="panel"><div class="panel-head"><h2>Makurdi customer locations</h2><span style="color:var(--muted);font-size:12px" id="birs-map-count"></span></div>${toolbar()}<div class="map-layout"><div class="map-wrap"><svg class="map" aria-label="Interactive map of sample customer locations on sourced Makurdi roads"></svg><div class="map-control"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="reset">Reset</button></div><div class="map-caption">Roads © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> · Demo pins</div></div><div class="detail" aria-live="polite"></div></div><div class="legend">${Object.entries(colours).map(([s,c])=>`<span><span class="dot" style="background:${c}"></span>${s}</span>`).join('')}<span>P: Pending · V: Verified · F: Follow-up</span><span>Pin locations are illustrative</span></div></div>`}
function table(rows){return `<div class="table-scroll"><table><thead><tr><th>Customer / property</th><th>Area</th><th>Category</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="link" data-record="${r.id}">${esc(r.name)}</button><div style="color:var(--muted);font-size:11px">${r.id} · ${r.type}</div></td><td>${esc(r.area)}</td><td>${esc(r.category)}</td><td>${badge(r.status)}</td><td><button data-record="${r.id}">View</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No records match these filters.</td></tr>'}</tbody></table></div>`}
function render(){
root.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
let html=(storageError?`<div class="notice" role="alert">${esc(storageError)}</div>`:'')+(message?`<div class="toast" role="status">${esc(message)}</div>`:'');
if(page==='overview')html+=heading('A clearer view of Makurdi','Customer records, locations and field activity in one place.','<button class="primary" data-action="new">+ Register customer</button>')+stats()+mapPanel()+`<div class="twocol"><div class="panel"><div class="panel-head"><h2>Records by area</h2></div><div class="rows">${['High Level','North Bank','Wadata','Wurukum','Modern Market'].map(a=>{let n=records.filter(r=>r.area===a).length;return `<div class="row"><div style="flex:1">${a}<div class="bar"><span style="width:${n/records.length*100}%"></span></div></div><strong>${n}</strong></div>`}).join('')}</div></div><div class="panel"><div class="panel-head"><h2>Recent activity</h2></div><div class="rows">${activity.slice(0,5).map(a=>`<div class="row"><div>${esc(a.title)}<small>${esc(a.sub)}</small></div></div>`).join('')}</div></div></div>`;
if(page==='map')html+=heading('Location map','Explore customer locations and linked properties.', '<button class="primary" data-action="new">+ Add location</button>')+mapPanel();
if(page==='records')html+=heading('Customer records','Linked taxpayer, business and property information.','<button class="primary" data-action="new">+ New record</button>')+`<div class="panel">${toolbar()}<div id="birs-table">${table(filtered())}</div></div>`;
if(page==='reviews')html+=heading('Verification queue','Review captured details before approving a record.')+`<div class="panel">${table(records.filter(r=>r.status==='Pending review'))}</div><div class="status-note">Open a record to verify it or request a follow-up. This demo uses fictional submissions.</div>`;
if(page==='visits')html+=heading('Field visits','Assign and record follow-up activity.')+`<div class="panel">${visits.map((v,i)=>{const r=records.find(r=>r.id===v.record);return `<div class="visit-card"><div class="row"><div><h3>${esc(r.name)}</h3><small>${r.area} · ${v.officer}</small></div>${badge(v.state)}</div><p>${esc(v.note)}</p>${v.state==='Scheduled'?`<button class="primary" data-complete="${i}">Record visit completed</button>`:'<div class="status-note">Visit recorded. Customer verification remains a separate decision.</div>'}</div>`}).join('')}</div>`;
if(page==='detail')html+=fullDetail();
if(page==='register')html+=heading(editingId?'Edit business details':parentId?'Add a shop to this plaza':'Field registration','Capture a customer and link their business to a location.')+`<form id="birs-registration" class="panel"><div class="panel-head"><h2>${editingId?esc(selected.name):parentId?esc(records.find(r=>r.id===parentId).name):'New customer record'}</h2><span class="badge pending">${editingId?'Re-verification required':'Pending review'}</span></div><div class="formgrid"><label>Business / property name *<input name="name" required maxlength="100" placeholder="Enter trading or property name"></label><label>Taxpayer / operator name *<input name="owner" required maxlength="100" placeholder="Enter taxpayer name"></label><label>Record type<select name="type"><option ${parentId?'':'selected'}>Standalone business</option><option>Plaza</option><option ${parentId?'selected':''}>Shop</option></select></label><label>Business category<select name="category"><option>Retail</option><option>Services</option><option>Healthcare</option><option>Hospitality</option><option>Manufacturing</option><option>Commercial property</option></select></label><label>Area<select name="area">${['High Level','North Bank','Wadata','Wurukum','Modern Market'].map(a=>`<option>${a}</option>`).join('')}</select></label><label>Address / shop number *<input name="address" required maxlength="180" placeholder="Street, landmark or unit number"></label><label>Existing official BTIN / TIN<input name="tin" placeholder="Optional; unverified in demo"></label><label>Phone number<input name="phone" type="tel" placeholder="Optional sample contact"></label><div class="span2 location-box"><div><strong>Location capture</strong><div id="birs-gps">No position selected</div></div><button type="button" data-location>Use sample GPS location</button></div><label>Latitude *<input name="lat" type="number" step="any" min="7.67" max="7.78" required placeholder="7.7120"></label><label>Longitude *<input name="lng" type="number" step="any" min="8.48" max="8.62" required placeholder="8.5280"></label><label class="span2">Field notes<textarea name="notes" rows="2" maxlength="400" placeholder="Occupancy, access details or observations"></textarea></label></div><div class="notice">Demo location capture is simulated. Records are saved in this browser and enter the verification queue. Editing a record returns it to pending review.</div><div class="formfoot"><button type="button" data-cancel>Cancel</button><button type="submit" class="primary">${editingId?'Save changes for review':'Submit for verification'}</button></div></form>`;

function formatDate(d){return d?new Date(d).toLocaleString():'Not recorded';}
function fullDetail(){const r=selected;if(!r)return heading('Business details','Select a record from the customer list.');const value=v=>esc(v||'Not provided');const shops=records.filter(x=>x.parent===r.id),history=activity.filter(a=>a.recordId===r.id);return heading(r.name,`${r.id} · ${r.type}`, '<button data-back>Back to records</button>')+`<div class="detail-overview"><div>${badge(r.status)}<p>Changes are saved in this browser. Verification is a demo workflow.</p></div><div class="detail-actions"><button data-map>View on map</button><button data-edit>Edit details</button>${r.status!=='Verified'?'<button class="primary" data-verify>Verify business</button>':''}<button data-follow>Request follow-up</button><button data-visit>Schedule visit</button>${r.type==='Plaza'?'<button data-shop>Add shop / unit</button>':''}</div></div><div class="detail-grid"><section class="panel"><div class="panel-head"><h2>Business & taxpayer</h2></div><dl class="full-fields"><dt>Business name</dt><dd>${value(r.name)}</dd><dt>Taxpayer / operator</dt><dd>${value(r.owner)}</dd><dt>Category</dt><dd>${value(r.category)}</dd><dt>Record type</dt><dd>${value(r.type)}</dd><dt>Official BTIN / TIN</dt><dd>${value(r.tin)}${r.tin?' · not independently validated':''}</dd><dt>Phone number</dt><dd>${value(r.phone)}</dd><dt>Field notes</dt><dd>${value(r.notes)}</dd></dl></section><section class="panel"><div class="panel-head"><h2>Location & verification</h2></div><dl class="full-fields"><dt>Area</dt><dd>${value(r.area)}</dd><dt>Address / unit</dt><dd>${value(r.address)}</dd><dt>Coordinates</dt><dd>${r.lat.toFixed(6)}, ${r.lng.toFixed(6)} · demo location</dd><dt>Assigned officer</dt><dd>${value(r.officer)}</dd><dt>Created</dt><dd>${formatDate(r.createdAt)}</dd><dt>Last updated</dt><dd>${formatDate(r.updatedAt)}</dd><dt>Verified</dt><dd>${formatDate(r.verifiedAt)}</dd>${r.parent?`<dt>Linked property</dt><dd><button class="link" data-open="${esc(r.parent)}">${value(records.find(x=>x.id===r.parent)?.name)}</button></dd>`:''}</dl></section></div>${r.type==='Plaza'?`<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>Linked shops / units</h2><span>${shops.length} registered${r.units?' of '+r.units+' reported units':''}</span></div>${shops.length?table(shops):'<div class="empty">No shops registered yet.</div>'}</section>`:''}<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>Business activity history</h2></div><div class="rows">${history.length?history.map(a=>`<div class="row"><div>${esc(a.title)}<small>${esc(a.sub)}</small></div></div>`).join(''):'<div class="empty">No changes recorded for this sample business yet.</div>'}</div></section>`;}
function scheduleVisit(){if(visits.some(v=>v.record===selected.id&&v.state==='Scheduled')){message='An open visit is already scheduled for this business.';render();return;}visits.push({record:selected.id,officer:selected.officer,state:'Scheduled',note:'Review business details and confirm location.'});recordEvent('Field visit scheduled',selected.id);save();message='Visit scheduled. It is now listed in Field visits.';render();}
function bindDetail(){content.querySelector('[data-back]')?.addEventListener('click',()=>go('records'));content.querySelector('[data-map]')?.addEventListener('click',()=>go('map'));content.querySelector('[data-edit]')?.addEventListener('click',()=>{editingId=selected.id;parentId='';go('register')});content.querySelector('[data-verify]')?.addEventListener('click',()=>updateStatus('Verified'));content.querySelector('[data-follow]')?.addEventListener('click',()=>updateStatus('Follow-up'));content.querySelector('[data-visit]')?.addEventListener('click',scheduleVisit);content.querySelector('[data-shop]')?.addEventListener('click',()=>{parentId=selected.id;editingId='';go('register')});content.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=records.find(r=>r.id===b.dataset.open);go('detail')});}
function showDetail(){const d=content.querySelector('.detail');if(!d)return;let r=selected;if(!r){d.innerHTML='<p>No customer selected.</p>';return;}d.innerHTML=`<div class="initial">${esc(r.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><h2>${esc(r.name)}</h2><p>${r.id} · ${esc(r.type)}</p>${badge(r.status)}<dl><dt>Taxpayer / operator</dt><dd>${esc(r.owner)}</dd><dt>Area & address</dt><dd>${esc(r.address)}</dd><dt>Location</dt><dd>${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</dd><dt>Assigned officer</dt><dd>${esc(r.officer)}</dd>${r.parent?`<dt>Linked property</dt><dd>${esc(records.find(x=>x.id===r.parent)?.name)}</dd>`:''}${r.type==='Plaza'?`<dt>Units</dt><dd>${r.units||0} total · ${records.filter(x=>x.parent===r.id).length} linked in demo</dd>`:''}</dl>${r.status!=='Verified'?'<button class="primary" data-verify>Verify record</button>':''}${r.status!=='Follow-up'?'<button data-follow>Request follow-up</button>':''}${r.type==='Plaza'?'<button data-shop>+ Add shop / unit</button>':''}<button class="primary" data-expand>Open full business details</button><div class="status-note">Official tax status is not evaluated in this demo.</div>`;
d.querySelector('[data-expand]')?.addEventListener('click',()=>go('detail'));d.querySelector('[data-verify]')?.addEventListener('click',()=>updateStatus('Verified'));d.querySelector('[data-follow]')?.addEventListener('click',()=>updateStatus('Follow-up'));d.querySelector('[data-shop]')?.addEventListener('click',()=>{parentId=r.id;editingId='';go('register')});}
function updateStatus(s){if(s===selected.status){message="This business already has that status.";render();return;}selected.status=s;selected.updatedAt=new Date().toISOString();if(s==='Verified')selected.verifiedAt=selected.updatedAt;else selected.verifiedAt=null;if(s==='Follow-up'&&!visits.some(v=>v.record===selected?.id&&v.state==='Scheduled'))visits.push({record:selected.id,officer:selected.officer,state:'Scheduled',note:'Verify details flagged by the supervisor.'});recordEvent(`${selected.name}: ${s.toLowerCase()}`,selected.id);save();message=`${selected.name} updated to ${s.toLowerCase()}.`;render()}
function bind(){if(page==='detail')bindDetail();content.querySelectorAll('[data-action="new"]').forEach(b=>b.onclick=()=>{parentId='';editingId='';message='';go('register')});content.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{selected=records.find(r=>r.id===b.dataset.record);message='';go('detail')});content.querySelector('.search')?.addEventListener('input',e=>{query=e.target.value;updateResults()});content.querySelector('.status-filter')?.addEventListener('change',e=>{filter=e.target.value;updateResults()});content.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{if(b.dataset.zoom==='reset')svg.call(zoom.transform,d3.zoomIdentity);else svg.call(zoom.scaleBy,b.dataset.zoom==='in'?1.5:1/1.5)});content.querySelector('[data-location]')?.addEventListener('click',()=>{const f=content.querySelector('form'),p=parentId?records.find(r=>r.id===parentId):{lat:7.712,lng:8.528};f.elements.lat.value=p.lat;f.elements.lng.value=p.lng;root.querySelector('#birs-gps').textContent=`${p.lat.toFixed(4)}, ${p.lng.toFixed(4)} · simulated position`;});content.querySelector('[data-cancel]')?.addEventListener('click',()=>{if(editingId){editingId='';go('detail')}else go('records')});content.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{visits[+b.dataset.complete].state='Completed';recordEvent('Field visit completed',visits[+b.dataset.complete].record);save();message='Visit completion recorded. Review the customer separately to change verification status.';render()});content.querySelector('form')?.addEventListener('submit',e=>{e.preventDefault();let f=e.target;const val=n=>f.elements[n].value.trim();let name=val('name');if(records.some(r=>r.id!==editingId&&r.name.toLowerCase()===name.toLowerCase()&&r.area===val('area'))){f.elements.name.setCustomValidity('A matching name already exists in this area. Check the customer records.');f.elements.name.reportValidity();f.elements.name.oninput=()=>f.elements.name.setCustomValidity('');return}const r={id:editingId||nextId(),name,owner:val('owner'),type:val('type'),category:val('category'),area:val('area'),address:val('address'),lat:+val('lat'),lng:+val('lng'),status:'Pending review',officer:'Demo field officer',tin:val('tin'),phone:val('phone'),notes:val('notes')};if(parentId){const p=records.find(r=>r.id===parentId);r.parent=parentId;r.area=p.area;}r.updatedAt=new Date().toISOString();r.createdAt=editingId?(selected.createdAt||r.updatedAt):r.updatedAt;r.verifiedAt=null;if(editingId){r.parent=selected.parent;r.officer=selected.officer;r.units=selected.units;records[records.findIndex(x=>x.id===editingId)]=r;}else records.push(r);selected=r;recordEvent(`${r.name} ${editingId?'updated':'registered'}`,r.id);save();editingId='';parentId='';message=`${r.id} submitted for verification. Select its map pin to review.`;go('map')});}
function updateResults(){if(page==='records'){content.querySelector('#birs-table').innerHTML=table(filtered());content.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{selected=records.find(r=>r.id===b.dataset.record);go('detail')});}else updatePins()}

function drawMap(){if(typeof d3==='undefined'){content.querySelector('.map-wrap').innerHTML='<div class="empty">Map library could not load. Customer records remain available.</div>';return;}const node=content.querySelector('.map');const width=node.parentElement.clientWidth,height=width<400?330:380;svg=d3.select(node).attr('viewBox',`0 0 ${width} ${height}`);projection=d3.geoMercator().fitExtent([[25,24],[width-25,height-25]],geography);const path=d3.geoPath(projection);mapGroup=svg.append('g');mapGroup.append('g').selectAll('path').data(geography.features.filter(f=>f.properties.river)).join('path').attr('d',path).attr('fill','none').attr('stroke','#bdd5d8').attr('stroke-width',14).attr('stroke-linejoin','round');const roads=geography.features.filter(f=>!f.properties.river);mapGroup.append('g').selectAll('path').data(roads).join('path').attr('d',path).attr('fill','none').attr('stroke','#fff').attr('stroke-width',f=>['primary','trunk'].includes(f.properties.class)?5:3).attr('stroke-linecap','round');mapGroup.append('g').selectAll('path').data(roads).join('path').attr('d',path).attr('fill','none').attr('stroke','#ccd8c7').attr('stroke-width',.65);

function updatePins(){if(!mapGroup)return;const rows=filtered();content.querySelector('#birs-map-count').textContent=`${rows.length} visible records`;const pins=mapGroup.select('.pins').selectAll('g').data(rows,r=>r.id).join(enter=>{let g=enter.append('g').attr('class','map-pin').attr('role','button').attr('tabindex',0);g.append('circle').attr('class','halo');g.append('circle').attr('class','core');g.append('text').attr('class','status-symbol');g.append('text').attr('class','pin-label');return g;}).attr('transform',r=>{const p=projection([r.lng,r.lat]);return `translate(${p[0]},${p[1]})`}).attr('aria-label',r=>`${r.name}, ${r.status}`).on('click',(e,r)=>{selected=r;showDetail();updatePins()}).on('keydown',(e,r)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=r;showDetail();updatePins()}});pins.select('.halo').attr('r',r=>r.id===selected?.id?13:10).attr('fill',r=>colours[r.status]).attr('opacity',.2);pins.select('.core').attr('r',8).attr('fill',r=>colours[r.status]).attr('stroke','white').attr('stroke-width',2);pins.select('.status-symbol').attr('y',3).attr('text-anchor','middle').attr('font-size',9).attr('font-weight',700).attr('fill','white').text(r=>r.status==='Verified'?'V':r.status==='Pending review'?'P':'F');pins.select('.pin-label').attr('y',-18).attr('text-anchor','middle').attr('font-size',11).attr('fill','#18392b').attr('paint-order','stroke').attr('stroke','white').attr('stroke-width',3).text(r=>r.id===selected?.id?r.name+' · '+r.status:'');}
